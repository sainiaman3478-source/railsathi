name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Fix Android Project
        run: |
          if [! -d "android" ]; then
            flutter create. --platforms=android --project-name railsathi
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if! grep -q "INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n <application/' "$MANIFEST"
          fi
          cat "$MANIFEST" | grep permission || echo "permission added"
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: railsathi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
