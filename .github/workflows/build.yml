name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Recreate Android Properly
        run: |
          rm -rf android
          flutter create . --platforms=android
          cat android/app/src/main/AndroidManifest.xml

      - name: Add Internet Permission
        run: |
          python3 -c "
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text()
          if 'android.permission.INTERNET' not in t:
              t = t.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\" />\n <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n <application')
              p.write_text(t)
          print(p.read_text())
          "

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: railsathi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
